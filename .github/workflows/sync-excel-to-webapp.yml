name: Sync webapp from Excel

on:
  push:
    paths:
      - "*.xlsx"   # runs whenever an .xlsx file in the repo root is added or changed
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the regenerated index.html

jobs:
  update-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so we can tell which file was committed last

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Find the most recently uploaded Excel file
        id: find_xlsx
        run: |
          newest=""
          newest_ts=0
          count=0
          while IFS= read -r -d '' f; do
            f="${f#./}"
            count=$((count+1))
            ts=$(git log -1 --format=%ct -- "$f")
            echo "  candidate: $f (last committed: $(date -u -d @"${ts:-0}" '+%Y-%m-%d %H:%M:%S UTC'))"
            if [ "${ts:-0}" -gt "$newest_ts" ]; then
              newest_ts="$ts"
              newest="$f"
            fi
          done < <(find . -maxdepth 1 -name '*.xlsx' -print0)

          if [ -z "$newest" ]; then
            echo "No .xlsx file found in the repo root -- nothing to do."
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::warning::Found $count .xlsx files in the repo root. Using the most recently committed one. Delete the old copies to avoid confusion."
          fi
          echo "Using file: $newest"
          echo "file=$newest" >> "$GITHUB_OUTPUT"

      - name: Regenerate index.html from the Excel file
        run: python update_data.py "${{ steps.find_xlsx.outputs.file }}"

      - name: Commit and push if index.html changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html -- schedule data was already up to date."
          else
            git commit -m "Auto-update webapp from ${{ steps.find_xlsx.outputs.file }}"
            git push
          fi

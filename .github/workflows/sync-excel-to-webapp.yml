name: Sync webapp from Excel

on:
  push:
    paths:
      - "*.xlsx"   # runs whenever an .xlsx file in the repo root is added or changed
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the regenerated index.html

jobs:
  update-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Find the Excel file
        id: find_xlsx
        run: |
          FILE=$(ls -1 *.xlsx 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .xlsx file found in the repo root -- nothing to do."
            exit 1
          fi
          echo "Using file: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Regenerate index.html from the Excel file
        run: python update_data.py "${{ steps.find_xlsx.outputs.file }}"

      - name: Commit and push if index.html changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html -- schedule data was already up to date."
          else
            git commit -m "Auto-update webapp from ${{ steps.find_xlsx.outputs.file }}"
            git push
          fi

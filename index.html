<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסעות שישי · דביר תשפ"ז</title>
<style>
  :root{
    --bg:#FAFAF8;
    --card:#FFFFFF;
    --ink:#1C2333;
    --ink-soft:#5B6172;
    --border:#E4E2DA;
    --bus1:#2F6FED;
    --bus1-bg:#E9F0FE;
    --bus2:#B8860B;
    --bus2-bg:#FBF1DA;
    --bus3:#1F9D6B;
    --bus3-bg:#E5F6EE;
    --car:#6B5CA5;
    --car-bg:#EFEBF7;
    --morning:#D9770B;
    --afternoon:#A63D7A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Arial Hebrew","Heebo",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:24px 18px 60px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.2px;
  }
  header p{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
  }
  .tabs{
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    margin-bottom:18px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 8px;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    border-radius:7px;
    cursor:pointer;
    font-family:inherit;
  }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type="text"], select{
    width:100%;
    font-size:16px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
  }
  input[type="text"]:focus, select:focus{
    outline:none;
    border-color:var(--bus1);
  }
  .autocomplete-wrap{
    position:relative;
  }
  .suggestions{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    right:0;
    left:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 6px 18px rgba(28,35,51,0.10);
    max-height:240px;
    overflow-y:auto;
    z-index:20;
  }
  .suggestions.open{ display:block; }
  .suggestion-item{
    padding:10px 12px;
    font-size:15px;
    cursor:pointer;
  }
  .suggestion-item:not(:last-child){
    border-bottom:1px solid var(--border);
  }
  .suggestion-item:hover, .suggestion-item.highlighted{
    background:var(--bus1-bg);
  }
  .suggestions-empty{
    padding:12px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:28px 10px;
    border:1px dashed var(--border);
    border-radius:10px;
    margin-top:8px;
  }
  .result-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }
  .result-card .date-row{
    font-size:14px;
    font-weight:700;
  }
  .cal-btn{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 14px;
    text-decoration:none;
    white-space:nowrap;
  }
  .cal-btn svg{
    width:16px;
    height:16px;
    flex:none;
  }
  .cal-btn:hover{
    background:var(--bus1-bg);
    color:var(--bus1);
    border-color:var(--bus1);
  }
  .result-card .shift-row{
    font-size:16px;
    font-weight:700;
    margin-bottom:10px;
  }
  .result-card .shift-row.shift-morning{ color:var(--morning); }
  .result-card .shift-row.shift-afternoon{ color:var(--afternoon); }
  .name-phone{
    font-size:13px;
    color:var(--ink-soft);
    direction:ltr;
    text-align:right;
    margin-bottom:10px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    padding:4px 10px 4px 4px;
    border-radius:999px;
    margin:0 0 6px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;flex:none;
  }
  .role-line{
    padding:9px 0;
    border-top:1px solid var(--border);
    font-size:14px;
  }
  .role-line:first-of-type{border-top:none;}
  .role-line-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:3px;
  }
  .role-name{
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .role-val{
    font-weight:600;
  }
  .role-phone{
    display:block;
    font-size:12.5px;
    font-weight:400;
    color:var(--ink-soft);
    direction:ltr;
    text-align:right;
    margin-top:1px;
  }
  .shift-block{
    margin-bottom:12px;
  }
  .shift-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 4px;
  }
  .shift-title:first-child{margin-top:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הסעות שישי · דביר</h1>
    <p>שנת הלימודים תשפ"ז</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="byName">לפי שם</button>
    <button class="tab-btn" data-tab="byDate">לפי תאריך</button>
  </div>

  <div id="byName" class="panel active">
    <div class="field autocomplete-wrap">
      <label for="nameInput">שם משפחה</label>
      <input type="text" id="nameInput" placeholder="התחילו להקליד שם משפחה..." autocomplete="off">
      <div id="nameSuggestions" class="suggestions"></div>
    </div>
    <div id="nameResults"></div>
  </div>

  <div id="byDate" class="panel">
    <div class="field">
      <label for="dateSelect">תאריך</label>
      <select id="dateSelect"></select>
    </div>
    <div id="dateResults"></div>
  </div>
</div>

<script>
const ROLES = [
  {key:'bus1', label:'הסעה 1 (א-ב)', color:'var(--bus1)', bg:'var(--bus1-bg)'},
  {key:'bus2', label:'הסעה 2 (ג-ו)', color:'var(--bus2)', bg:'var(--bus2-bg)'},
  {key:'bus3', label:'הסעה 3 (ד-ה)', color:'var(--bus3)', bg:'var(--bus3-bg)'},
  {key:'car',  label:'רכב מסיע',     color:'var(--car)',  bg:'var(--car-bg)'},
];

let DATA = {schedule:[], families:[], phones:{}};

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function roleChip(role){
  return `<span class="role-name"><span class="dot" style="background:${role.color}"></span>${role.label}</span>`;
}

function googleCalendarUrl(dateIso, shiftLabel, roleLabel){
  const dateStr = dateIso.replace(/-/g,'');
  const isMorning = shiftLabel === 'בוקר';
  const title = isMorning ? 'ליווי הסעות הלוך' : 'ליווי הסעות חזור';
  const startTime = isMorning ? '071500' : '111500';
  const endTime = isMorning ? '081500' : '121500';
  const titleEnc = encodeURIComponent(title);
  const details = encodeURIComponent(`${roleLabel} - לוח ההסעות של ימי שישי, דביר`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titleEnc}` +
         `&dates=${dateStr}T${startTime}/${dateStr}T${endTime}&details=${details}&ctz=Asia/Jerusalem`;
}

const CAL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

function calendarButton(dateIso, shiftLabel, roleLabel){
  const url = googleCalendarUrl(dateIso, shiftLabel, roleLabel);
  return `<a class="cal-btn" href="${url}" target="_blank" rel="noopener">${CAL_ICON}יומן</a>`;
}

function renderDateBlock(dateRows){
  let html = '';
  dateRows.forEach(row=>{
    html += `<div class="shift-block"><div class="shift-title">${row.shift}</div>`;
    ROLES.forEach(role=>{
      const name = row[role.key] || '—';
      const phone = DATA.phones[name];
      const phoneHtml = phone ? `<span class="role-phone">${phone}</span>` : '';
      const calHtml = calendarButton(row.date, row.shift, role.label);
      html += `<div class="role-line"><div class="role-line-head">${roleChip(role)}${calHtml}</div><span class="role-val">${name}${phoneHtml}</span></div>`;
    });
    html += `</div>`;
  });
  return html;
}

function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
}

function initNameSearch(){
  const input = document.getElementById('nameInput');
  const suggestionsBox = document.getElementById('nameSuggestions');
  const results = document.getElementById('nameResults');

  let visibleMatches = [];
  let highlightedIdx = -1;
  let selectedName = null;

  function closeSuggestions(){
    suggestionsBox.classList.remove('open');
    suggestionsBox.innerHTML = '';
    visibleMatches = [];
    highlightedIdx = -1;
  }

  function renderSuggestions(matches){
    visibleMatches = matches;
    highlightedIdx = -1;
    if(matches.length === 0){
      suggestionsBox.innerHTML = '<div class="suggestions-empty">לא נמצאה משפחה כזו</div>';
      suggestionsBox.classList.add('open');
      return;
    }
    suggestionsBox.innerHTML = matches.map((name,i)=>
      `<div class="suggestion-item" data-idx="${i}">${name}</div>`
    ).join('');
    suggestionsBox.classList.add('open');
  }

  function updateHighlight(){
    [...suggestionsBox.querySelectorAll('.suggestion-item')].forEach((el,i)=>{
      el.classList.toggle('highlighted', i===highlightedIdx);
    });
  }

  function showFamilyResults(name){
    selectedName = name;
    input.value = name;
    closeSuggestions();

    const matches = DATA.schedule.filter(row =>
      ROLES.some(role => row[role.key] === name)
    ).sort((a,b)=> a.date.localeCompare(b.date) || a.shift.localeCompare(b.shift));

    results.innerHTML = '';
    if(matches.length === 0){
      results.innerHTML = `<div class="empty">לא נמצאו שיבוצים עבור "${name}"</div>`;
      return;
    }

    const phone = DATA.phones[name];
    const phoneBlockHtml = phone ? `<div class="name-phone">${phone}</div>` : '';

    matches.forEach(row=>{
      const card = document.createElement('div');
      card.className = 'result-card';
      const shiftClass = row.shift === 'בוקר' ? 'shift-morning' : 'shift-afternoon';
      const matchedRole = ROLES.find(role => row[role.key] === name);
      const calHtml = matchedRole ? calendarButton(row.date, row.shift, matchedRole.label) : '';
      let inner = `<div class="card-head"><div class="date-row">${formatDate(row.date)}</div>${calHtml}</div>` +
                  `<div class="shift-row ${shiftClass}">${row.shift}</div>` +
                  phoneBlockHtml;
      ROLES.forEach(role=>{
        if(row[role.key] === name){
          inner += `<div class="chip" style="background:${role.bg};color:${role.color}"><span class="dot" style="background:${role.color}"></span>${role.label}</div>`;
        }
      });
      card.innerHTML = inner;
      results.appendChild(card);
    });
  }

  input.addEventListener('input', ()=>{
    selectedName = null;
    results.innerHTML = '';
    const q = input.value.trim();
    if(!q){ closeSuggestions(); return; }
    const matches = DATA.families.filter(name => name.includes(q));
    renderSuggestions(matches);
  });

  input.addEventListener('keydown', (e)=>{
    if(!suggestionsBox.classList.contains('open')) return;
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(visibleMatches.length){
        highlightedIdx = (highlightedIdx + 1) % visibleMatches.length;
        updateHighlight();
      }
    }else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(visibleMatches.length){
        highlightedIdx = (highlightedIdx - 1 + visibleMatches.length) % visibleMatches.length;
        updateHighlight();
      }
    }else if(e.key === 'Enter'){
      e.preventDefault();
      if(highlightedIdx >= 0 && visibleMatches[highlightedIdx]){
        showFamilyResults(visibleMatches[highlightedIdx]);
      }else if(visibleMatches.length === 1){
        showFamilyResults(visibleMatches[0]);
      }
    }else if(e.key === 'Escape'){
      closeSuggestions();
    }
  });

  // mousedown (not click) so it fires before the input's blur event closes the list
  suggestionsBox.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.suggestion-item');
    if(!item || item.dataset.idx === undefined) return;
    const name = visibleMatches[Number(item.dataset.idx)];
    if(name) showFamilyResults(name);
  });

  input.addEventListener('blur', ()=>{
    setTimeout(closeSuggestions, 150);
  });
}


function initDateSearch(){
  const select = document.getElementById('dateSelect');
  const results = document.getElementById('dateResults');

  const dates = [...new Set(DATA.schedule.map(r=>r.date))].sort();
  const todayISO = new Date().toISOString().slice(0,10);
  let defaultDate = dates.find(d => d >= todayISO) || dates[dates.length-1];

  dates.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = 'יום שישי, ' + formatDate(d);
    if(d === defaultDate) opt.selected = true;
    select.appendChild(opt);
  });

  function show(){
    const d = select.value;
    const rows = DATA.schedule.filter(r=>r.date===d).sort((a,b)=>a.shift.localeCompare(b.shift));
    results.innerHTML = renderDateBlock(rows);
  }

  select.addEventListener('change', show);
  show();
}

try{
  DATA = JSON.parse(document.getElementById('schedule-data').textContent);
  initTabs();
  initNameSearch();
  initDateSearch();
}catch(e){
  document.querySelector('.wrap').innerHTML =
    '<div class="empty">שגיאה בטעינת נתוני הלוח.</div>';
}
</script>
